    <!-- Theme initialization script to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('airil_portfolio_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'light' || (!stored && !prefersDark)) {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-terminal-green selection:text-black">
